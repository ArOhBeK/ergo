// Baseline thin-mode overlay. Run with: java -jar ergo-*.jar --mainnet -c thin.conf
include "application.conf"

ergo {
  node {
    execution {
      mode = thin
      validation.endpoint = "grpc://validation-core:9053" // point to your Validation Core
    }
    wallet.mode = delegated        // delegated|filtered|full (delegated is default for thin)
    verifyTransactions = true      // enforced in thin mode
    verifyScripts = true           // enforced in thin mode
    stateType = digest             // enforced in thin mode
    useExternalMiner = true        // required if mining while thin
  }
}
